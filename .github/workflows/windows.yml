name: Versión Windows (.exe)

on:
  push:
    branches: [main, mundo]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref_name }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  # main -> release windows-latest; rama mundo (mapa abierto de Madrid, en pruebas) -> release windows-mundo
  ETIQUETA: ${{ github.ref_name == 'main' && 'windows-latest' || 'windows-mundo' }}

jobs:
  exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Caché de Godot y plantilla Windows
        id: cache
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-windows-x86_64

      - name: Descargar Godot y la plantilla de Windows
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -e
          V=${GODOT_VERSION}
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${V}.stable
          cd ~/godot
          curl -fsSL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_linux.x86_64.zip
          unzip -q godot.zip && rm godot.zip
          curl -fsSL --retry 3 -o plantillas.tpz https://github.com/godotengine/godot/releases/download/${V}-stable/Godot_v${V}-stable_export_templates.tpz
          unzip -q -j plantillas.tpz templates/windows_release_x86_64.exe templates/version.txt -d ~/.local/share/godot/export_templates/${V}.stable
          rm plantillas.tpz

      - name: Exportar a Windows
        run: |
          set -e
          GODOT=~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64
          mkdir -p build/windows
          cd juego
          $GODOT --headless --import || true
          $GODOT --headless --export-release "Windows Desktop" ../build/windows/Carreteras.exe
          cd ..
          test -s build/windows/Carreteras.exe
          cat > build/windows/LEEME.txt <<EOF
          Carreteras de España 1:1 — versión para Windows
          Generada automáticamente desde el commit ${GITHUB_SHA::7} ($(date -u '+%Y-%m-%d %H:%M') UTC).

          1. Descomprime el zip en una carpeta (por ejemplo, el Escritorio). No lo abras desde dentro del zip.
          2. Abre Carreteras.exe.
          3. Si Windows dice "Windows protegió su PC": pulsa "Más información" y luego "Ejecutar de todas formas".
             Sale porque el programa no está firmado con un certificado de pago; no es un virus.

          Requisitos mínimos: Windows 10/11 de 64 bits, procesador de 4 núcleos, 8 GB de RAM,
          gráfica con Direct3D 12, Vulkan 1.0 u OpenGL 3.3 (integrada Intel UHD 620 / AMD Vega 8 o mejor).
          Recomendado: 16 GB de RAM y gráfica dedicada tipo GTX 1050 Ti / RX 570 o mejor.

          Si no se abre, sale en negro o se cierra:
          - Abre "Carreteras (modo compatible).bat": arranca con OpenGL, que funciona en casi cualquier gráfica.
          - Actualiza el driver de la gráfica y cierra superposiciones (Overwolf, RivaTuner/Afterburner, grabadores).
          - En portátiles con dos gráficas: clic derecho > Ejecutar con procesador gráfico de alto rendimiento.
          - Para saber qué pasa: %APPDATA%\Godot\app_userdata\Carreteras de España 1-1\logs\godot.log
            y diagnostico.txt en esa misma carpeta (gráfica, driver y RAM que ve el juego).

          La primera vez elige solo "Gráficos: bajo" si la gráfica es integrada o el PC es justo, y si con
          "alto" va a menos de 30 FPS baja una vez a "bajo". Se puede cambiar en el menú. Alt+F4 para salir.
          EOF
          printf '@echo off\r\nrem Arranca Carreteras con OpenGL (para gráficas o drivers que no van con Direct3D 12 / Vulkan)\r\nstart "" "%%~dp0Carreteras.exe" --rendering-driver opengl3\r\n' > "build/windows/Carreteras (modo compatible).bat"
          # todo lo que deje la exportación junto al .exe (DLL de ANGLE / Direct3D 12 si los hubiera) va en el zip
          cd build/windows && zip -q -9 -r ../Carreteras-windows.zip .
          ls -la . ..

      - name: Publicar en la release (windows-latest o windows-mundo)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          NOTAS="Versión para Windows generada automáticamente desde el commit ${GITHUB_SHA::7} ($(date -u '+%Y-%m-%d %H:%M') UTC). Descarga Carreteras-windows.zip, descomprímelo y abre Carreteras.exe. Si Windows SmartScreen avisa: Más información → Ejecutar de todas formas (el exe no está firmado)."
          if gh release view "$ETIQUETA" >/dev/null 2>&1; then
            gh release upload "$ETIQUETA" build/Carreteras-windows.zip --clobber
            gh release edit "$ETIQUETA" --notes "$NOTAS"
          else
            if [ "$ETIQUETA" = "windows-latest" ]; then
              gh release create "$ETIQUETA" build/Carreteras-windows.zip --target "$GITHUB_SHA" --title "Carreteras para Windows (última versión)" --notes "$NOTAS"
            else
              gh release create "$ETIQUETA" build/Carreteras-windows.zip --target "$GITHUB_SHA" --prerelease --title "Carreteras para Windows · PRUEBA mapa abierto Comunidad de Madrid (rama mundo)" --notes "$NOTAS"
            fi
          fi
          gh release view "$ETIQUETA" --json assets --jq '.assets[] | "\(.name) \(.size)"'
